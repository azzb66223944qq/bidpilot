name: Fetch Announcements

on:
  schedule:
    - cron: '0 */2 * * *'  # 每2小时：北京时间 06:00/08:00/…持续换血
  workflow_dispatch: {}      # 手动触发

permissions:
  contents: write

concurrency:
  group: fetch-announcements
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Fetch announcements
        run: node scripts/fetch-announcements.mjs

      - name: Commit if changed
        run: |
          git config user.name "BidPilot Bot"
          git config user.email "bot@bidpilot.dev"
          git add data/announcements.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📊 公告更新 $(date +%Y-%m-%d)"
            git push
          fi
